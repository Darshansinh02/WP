<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Window</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            background: #f4f4f9;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Open a Window</h2>
    <button onclick="openCustomWindow()">New Window</button>
    <script>
        function openCustomWindow() {
            let params = "width=500,height=400,status=yes";
            let newWin = window.open("", "CustomWindow", params);
            newWin.document.write("<h1 style='font-family:sans-serif; text-align:center; padding-top:20px;'>Hello Darshan, I am new Window</h1>");
        }
    </script>
</body>
</html>
