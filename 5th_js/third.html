<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            margin-top: 50px; 
            background: #f0f2f5; }
        .calculator { 
            background: #333; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3); 
            width: 260px; }
        .display { 
            width: 100%; 
            height: 50px; 
            text-align: right; 
            font-size: 1.5em; 
            margin-bottom: 20px; 
            padding: 10px; 
            box-sizing: border-box; 
            border: none;
            border-radius: 5px;
            background: #eef;}
        .keys { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; }
        button { 
            padding: 15px 0; 
            font-size: 1.2em; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            background: #eee; 
            transition: 0.1s ease; }
        button:active { background: #ccc; }
        .op { background: #f9a826; color: white; font-weight: bold; }
        .op:active { background: #e09614; }
        .clear { background: #e74c3c; color: white; }
        .clear:active { background: #c0392b; }
        .equals { background: #2ecc71; color: white; font-weight: bold; }
        .equals:active { background: #27ae60; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="keys">
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="op" onclick="appendValue('+')">+</button>
        
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="op" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="op" onclick="appendValue('*')">*</button>

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('0')">0</button>
            <button class="equals" onclick="calculate()">=</button>
            <button class="op" onclick="appendValue('/')">/</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendValue(value) {
            display.value += value;
        }
        function clearDisplay() {
            display.value = '';
        }
        function calculate() {
            try {
                if (display.value) {
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
